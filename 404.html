<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting — Selena Media Archive</title>
  <script>
    // GitHub Pages SPA redirect: preserves path, query parameters, and hash
    (function () {
      var l = window.location;
      var path = l.pathname.slice(1);
      var query = l.search ? '&' + l.search.slice(1) : '';
      var redirectUrl = l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(path) + query + l.hash;
      l.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <p>Redirecting to archive...</p>
</body>
</html>
