<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting — Selena Media Archive</title>
  <script>
    // Selena uses hash-based client-side routing (e.g. "#/pin/<id>"), which
    // the browser never sends to the server — so a real 404 here means the
    // requested *path* itself doesn't exist as a static asset. There's
    // nothing meaningful to reconstruct from that path, so just send the
    // visitor back to the app root and preserve any hash they arrived with
    // (in case a host stripped it before this page loaded).
    (function () {
      var l = window.location;
      l.replace(l.protocol + '//' + l.host + '/' + l.hash);
    })();
  </script>
</head>
<body>
  <p>Redirecting to archive...</p>
</body>
</html>
