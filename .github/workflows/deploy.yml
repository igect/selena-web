name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

      - name: Inject Production Config
        run: |
          node -e "
          const fs = require('fs');
          const config = {
            SUPABASE_URL: process.env.PUBLIC_SUPABASE_URL || '',
            SUPABASE_ANON_KEY: process.env.PUBLIC_SUPABASE_ANON_KEY || '',
            MEDIA_CDN_URL: process.env.PUBLIC_MEDIA_CDN_URL || ''
          };
          const snippet = '<script>window.APP_CONFIG = ' + JSON.stringify(config) + ';</script>';
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace('</head>', snippet + '\n</head>');
          fs.writeFileSync('index.html', html);
          console.log('Production runtime config injected into index.html');
          "
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MEDIA_CDN_URL: ${{ vars.PUBLIC_MEDIA_CDN_URL }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
